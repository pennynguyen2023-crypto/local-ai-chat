name: Build desktop app

# Build cả 3 nền tảng (macOS/Windows/Linux) song song trên GitHub — máy Mac
# đang phát triển KHÔNG tự dựng được .exe/.deb thật (Tauri cross-compile
# Windows/Linux từ macOS không ổn định), nên đây là cách thực tế duy nhất.
# Đẩy 1 tag "v*" lên GitHub -> workflow tự chạy, đóng gói .dmg/.msi/.AppImage
# rồi đính kèm vào 1 GitHub Release nháp — vào Releases, sửa mô tả rồi bấm
# "Publish" để khách thấy (không tự public để có cơ hội kiểm tra trước).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target_triple: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target_triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            target_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài dependency hệ thống (Linux — Tauri cần webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cài dependency Node
        run: npm ci

      # Đóng gói sẵn Ollama (CPU-only, không kèm CUDA/ROCm/Vulkan để giữ file
      # cài đặt gọn) vào app — khách khỏi cần tự cài Ollama riêng. Khách đã tự
      # cài Ollama sẵn (vd để dùng GPU) thì app tự phát hiện port 11434 đang
      # có người dùng và bỏ qua bản đóng gói (xem src-tauri/src/lib.rs).
      # CHỈ lấy đúng file thư viện (.dylib/.so/.dll) — KHÔNG lấy thêm
      # llama-server/llama-quantize (2 binary phụ Ollama không cần cho
      # `serve` chat bình thường). Lần build trước đưa cả 2 binary đó +
      # license/text files vào resources làm "linuxdeploy" (công cụ đóng
      # AppImage) lỗi "failed to run linuxdeploy" — nghi do nó cố xử lý các
      # executable lạ nằm trong thư mục resources. Cũng giữ nguyên symlink
      # (vd libggml-base.so -> libggml-base.so.0 -> ....so.0.22.0) bằng
      # `cp -P` thay vì để find/cp mặc định bỏ qua symlink — thiếu symlink
      # này có thể khiến 1 lib khác không tìm ra dependency lúc chạy thật.
      - name: Tải Ollama đóng gói sẵn (macOS, CPU-only)
        if: matrix.platform == 'macos-latest'
        run: |
          curl -sL -o /tmp/ollama.tgz https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz
          mkdir -p /tmp/ollama-extract src-tauri/binaries src-tauri/resources/ollama-libs
          tar -xzf /tmp/ollama.tgz -C /tmp/ollama-extract
          cp /tmp/ollama-extract/ollama "src-tauri/binaries/ollama-${{ matrix.target_triple }}"
          chmod +x "src-tauri/binaries/ollama-${{ matrix.target_triple }}"
          find /tmp/ollama-extract -maxdepth 1 -name "*.dylib" -exec cp -P {} src-tauri/resources/ollama-libs/ \;

      - name: Tải Ollama đóng gói sẵn (Linux, CPU-only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y zstd
          curl -sL -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/latest/download/ollama-linux-amd64.tar.zst
          mkdir -p /tmp/ollama-extract src-tauri/binaries src-tauri/resources/ollama-libs
          zstd -d /tmp/ollama.tar.zst -c | tar -xf - -C /tmp/ollama-extract
          cp /tmp/ollama-extract/bin/ollama "src-tauri/binaries/ollama-${{ matrix.target_triple }}"
          chmod +x "src-tauri/binaries/ollama-${{ matrix.target_triple }}"
          find /tmp/ollama-extract/lib/ollama -maxdepth 1 -name "*.so*" -exec cp -P {} src-tauri/resources/ollama-libs/ \;

      - name: Tải Ollama đóng gói sẵn (Windows, CPU-only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip" -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive -Path "$env:TEMP\ollama.zip" -DestinationPath "$env:TEMP\ollama-extract" -Force
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\ollama-libs" | Out-Null
          Copy-Item "$env:TEMP\ollama-extract\ollama.exe" "src-tauri\binaries\ollama-${{ matrix.target_triple }}.exe"
          Get-ChildItem "$env:TEMP\ollama-extract\lib\ollama" -File -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "src-tauri\resources\ollama-libs\"
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ký các gói cập nhật (.tar.gz/.zip) bằng key riêng cho app này (đã
          # `gh secret set` sẵn, KHÔNG liên quan gì tới key ký code Apple/
          # Windows) — thiếu 2 biến này thì tauri-action vẫn build ra app
          # bình thường nhưng KHÔNG tạo/ký file latest.json, tính năng tự
          # cập nhật sẽ không hoạt động.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LM.RENVIDAI ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
